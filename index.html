<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Profissional de Lógica Binária Ladder</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1220;
    color:#e5e7eb;
}

header{
    background:#111827;
    padding:18px;
    border-bottom:1px solid #263244;
}

header h1{
    margin:0;
    font-size:22px;
    color:#fff;
}

header p{
    margin:6px 0 0;
    color:#94a3b8;
    font-size:13px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:15px;
    background:#0f172a;
    border-bottom:1px solid #263244;
}

.toolbar label{
    font-size:12px;
    color:#94a3b8;
    display:flex;
    flex-direction:column;
    gap:5px;
}

select,
button{
    border:1px solid #334155;
    background:#1e293b;
    color:#fff;
    padding:10px 12px;
    border-radius:7px;
    font-weight:bold;
}

button{
    cursor:pointer;
}

button:hover{
    background:#334155;
}

.btn-a{
    border-color:#2563eb;
}

.btn-b{
    border-color:#7c3aed;
}

.btn-reset{
    border-color:#dc2626;
}

.container{
    padding:15px;
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

.card{
    background:#111827;
    border:1px solid #263244;
    border-radius:10px;
    overflow:hidden;
}

.card-title{
    padding:12px 15px;
    border-bottom:1px solid #263244;
    font-weight:bold;
    color:#fff;
}

.card-body{
    padding:15px;
}

.status-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
}

.status{
    background:#0f172a;
    border:1px solid #263244;
    border-radius:8px;
    padding:12px;
}

.status small{
    display:block;
    color:#94a3b8;
    margin-bottom:5px;
}

.status strong{
    font-size:20px;
}

.value-on{
    color:#22c55e;
}

.value-off{
    color:#ef4444;
}

#diagramWrap{
    width:100%;
    overflow:auto;
    background:#020617;
    border-radius:8px;
}

svg{
    width:100%;
    min-width:850px;
    height:auto;
    display:block;
}

.rail{
    stroke:#64748b;
    stroke-width:6;
}

.wire{
    stroke:#475569;
    stroke-width:5;
    fill:none;
}

.wire.live{
    stroke:#22c55e;
}

.wire.output{
    stroke:#f59e0b;
}

.wire.bypass{
    stroke:#ef4444;
}

.contact{
    fill:#111827;
    stroke:#94a3b8;
    stroke-width:4;
}

.contact.live{
    stroke:#22c55e;
}

.contact.open{
    stroke:#ef4444;
}

.contact-text{
    fill:#fff;
    font-size:16px;
    font-weight:bold;
    text-anchor:middle;
}

.label{
    fill:#cbd5e1;
    font-size:14px;
    font-weight:bold;
}

.supply-label{
    fill:#22c55e;
    font-size:16px;
    font-weight:bold;
}

.lamp{
    fill:#1e293b;
    stroke:#64748b;
    stroke-width:4;
}

.lamp.on{
    fill:#f59e0b;
    stroke:#fbbf24;
}

.lamp-x{
    stroke:#94a3b8;
    stroke-width:3;
}

.lamp.on .lamp-x{
    stroke:#fff;
}

.truth{
    width:100%;
    border-collapse:collapse;
}

.truth th,
.truth td{
    border:1px solid #334155;
    padding:9px;
    text-align:center;
}

.truth th{
    background:#1e293b;
}

.truth td{
    background:#0f172a;
}

.truth tr.active td{
    background:#14532d;
    font-weight:bold;
}

.info{
    color:#cbd5e1;
    line-height:1.6;
    font-size:14px;
}

.formula{
    display:inline-block;
    margin-top:8px;
    padding:8px 12px;
    background:#020617;
    border:1px solid #334155;
    border-radius:6px;
    font-family:monospace;
    color:#f8fafc;
}

.message{
    padding:12px;
    border-radius:7px;
    background:#0f172a;
    border:1px solid #263244;
    color:#cbd5e1;
}

.error{
    background:#450a0a;
    border-color:#ef4444;
    color:#fecaca;
}

@media(max-width:700px){
    header h1{
        font-size:18px;
    }

    .toolbar{
        flex-direction:column;
    }

    .toolbar label,
    .toolbar select,
    .toolbar button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Simulador Profissional de Lógica Binária Ladder</h1>
    <p>Simulação de contatos NA/NF, alimentação, sinal, saída e tabela-verdade.</p>
</header>

<div class="toolbar">

    <label>
        FUNÇÃO LÓGICA
        <select id="logicType">
            <option value="BUFFER">BUFFER</option>
            <option value="NOT">NOT</option>
            <option value="AND">AND</option>
            <option value="NAND">NAND</option>
            <option value="OR">OR</option>
            <option value="NOR">NOR</option>
            <option value="XOR">XOR</option>
            <option value="XNOR">XNOR</option>
            <option value="SERIES">SERIES</option>
            <option value="PARALLEL">PARALLEL</option>
            <option value="BYPASS">BYPASS</option>
        </select>
    </label>

    <label>
        ALIMENTAÇÃO
        <select id="supply">
            <option value="1">24V — LIGADA</option>
            <option value="0">0V — DESLIGADA</option>
        </select>
    </label>

    <button class="btn-a" id="btnA">ALTERAR A</button>
    <button class="btn-b" id="btnB">ALTERAR B</button>
    <button class="btn-reset" id="btnReset">RESET</button>

</div>

<div class="container">

    <div class="card">
        <div class="card-title">STATUS DA SIMULAÇÃO</div>

        <div class="card-body">

            <div class="status-grid">

                <div class="status">
                    <small>ENTRADA A</small>
                    <strong id="statusA">0</strong>
                </div>

                <div class="status">
                    <small>ENTRADA B</small>
                    <strong id="statusB">0</strong>
                </div>

                <div class="status">
                    <small>ALIMENTAÇÃO</small>
                    <strong id="statusSupply">1</strong>
                </div>

                <div class="status">
                    <small>SINAL</small>
                    <strong id="statusSignal">0</strong>
                </div>

                <div class="status">
                    <small>SAÍDA Y</small>
                    <strong id="statusY">0</strong>
                </div>

                <div class="status">
                    <small>BYPASS</small>
                    <strong id="statusBypass">0</strong>
                </div>

            </div>

        </div>
    </div>


    <div class="card">

        <div class="card-title">
            DIAGRAMA LADDER
        </div>

        <div class="card-body">

            <div id="diagramWrap">
                <svg id="ladder" viewBox="0 0 1000 500">

                    <line class="rail"
                          x1="100"
                          y1="50"
                          x2="100"
                          y2="450"/>

                    <line class="rail"
                          x1="900"
                          y1="50"
                          x2="900"
                          y2="450"/>

                    <text x="75"
                          y="35"
                          class="supply-label">+24V</text>

                    <text x="875"
                          y="475"
                          class="label">0V</text>

                    <g id="circuit"></g>

                </svg>
            </div>

        </div>
    </div>


    <div class="card">

        <div class="card-title">
            DEFINIÇÃO DA FUNÇÃO
        </div>

        <div class="card-body">

            <div id="logicInfo" class="info"></div>

        </div>
    </div>


    <div class="card">

        <div class="card-title">
            TABELA-VERDADE
        </div>

        <div class="card-body">

            <table class="truth">

                <thead id="truthHead"></thead>

                <tbody id="truthBody"></tbody>

            </table>

        </div>
    </div>


    <div id="message" class="message">
        Sistema pronto para simulação.
    </div>

</div>


<script>

"use strict";

/* =========================================================
   ESTADO
========================================================= */

const state = {
    A: 0,
    B: 0,
    supply: 1,
    logic: "BUFFER",
    Y: 0,
    signal: 0,
    bypass: 0
};


/* =========================================================
   FUNÇÃO LÓGICA
========================================================= */

function calculate(a, b, logic){

    a = Number(a);
    b = Number(b);

    switch(logic){

        case "BUFFER":
            return a;

        case "NOT":
            return a === 0 ? 1 : 0;

        case "AND":
            return (a === 1 && b === 1) ? 1 : 0;

        case "NAND":
            return (a === 1 && b === 1) ? 0 : 1;

        case "OR":
            return (a === 1 || b === 1) ? 1 : 0;

        case "NOR":
            return (a === 1 || b === 1) ? 0 : 1;

        case "XOR":
            return a !== b ? 1 : 0;

        case "XNOR":
            return a === b ? 1 : 0;

        case "SERIES":
            return (a === 1 && b === 1) ? 1 : 0;

        case "PARALLEL":
            return (a === 1 || b === 1) ? 1 : 0;

        default:
            return 0;
    }
}


/* =========================================================
   BYPASS
========================================================= */

function calculateBypass(){

    /*
        A = NF

        A=0 -> contato fechado
        A=1 -> contato aberto

        B = NF

        B=0 -> bypass fechado
        B=1 -> bypass aberto

        Y = ¬A · B
    */

    const mainSignal =
        state.supply === 1 &&
        state.A === 0;

    const bypassActive =
        mainSignal &&
        state.B === 0;

    const lamp =
        mainSignal &&
        state.B === 1;

    return {
        signal: mainSignal ? 1 : 0,
        bypass: bypassActive ? 1 : 0,
        Y: lamp ? 1 : 0
    };
}


/* =========================================================
   ALTERAR A
========================================================= */

function toggleA(){

    state.A = state.A === 0 ? 1 : 0;

    update();
}


/* =========================================================
   ALTERAR B
========================================================= */

function toggleB(){

    state.B = state.B === 0 ? 1 : 0;

    update();
}


/* =========================================================
   RESET
========================================================= */

function resetAll(){

    state.A = 0;
    state.B = 0;
    state.supply = 1;

    update();
}


/* =========================================================
   CONTATO
========================================================= */

function contact(x, y, label, value, nc, input){

    const isClosed =
        nc
            ? value === 0
            : value === 1;

    const contactClass =
        isClosed
            ? "contact live"
            : "contact open";

    const text =
        nc
            ? "NF"
            : "NA";

    return `
        <g>

            <rect
                x="${x - 40}"
                y="${y - 35}"
                width="80"
                height="70"
                rx="8"
                class="${contactClass}"
            />

            <text
                x="${x}"
                y="${y - 7}"
                class="contact-text"
            >${text}</text>

            <text
                x="${x}"
                y="${y + 18}"
                class="contact-text"
            >${label}=${value}</text>

        </g>
    `;
}


/* =========================================================
   LÂMPADA
========================================================= */

function lamp(x, y, on){

    const cls = on
        ? "lamp on"
        : "lamp";

    return `
        <g>

            <circle
                cx="${x}"
                cy="${y}"
                r="30"
                class="${cls}"
            />

            <line
                x1="${x - 14}"
                y1="${y - 14}"
                x2="${x + 14}"
                y2="${y + 14}"
                class="lamp-x"
            />

            <line
                x1="${x + 14}"
                y1="${y - 14}"
                x2="${x - 14}"
                y2="${y + 14}"
                class="lamp-x"
            />

            <text
                x="${x}"
                y="${y + 55}"
                class="label"
                text-anchor="middle"
            >LÂMPADA Y</text>

        </g>
    `;
}


/* =========================================================
   FIO
========================================================= */

function wire(x1, y1, x2, y2, live, extraClass=""){

    let cls = "wire";

    if(live){
        cls += " live";
    }

    if(extraClass){
        cls += " " + extraClass;
    }

    return `
        <line
            x1="${x1}"
            y1="${y1}"
            x2="${x2}"
            y2="${y2}"
            class="${cls}"
        />
    `;
}


/* =========================================================
   RENDER BUFFER
========================================================= */

function renderBuffer(){

    const A = state.A;

    const closed = A === 1;

    let html = "";

    html += wire(100,250,250,250,state.supply === 1);

    html += contact(
        300,
        250,
        "A",
        A,
        false,
        "A"
    );

    html += wire(
        340,
        250,
        650,
        250,
        state.supply === 1 && closed
    );

    html += lamp(
        700,
        250,
        state.Y === 1
    );

    html += wire(
        730,
        250,
        900,
        250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   RENDER NOT
========================================================= */

function renderNot(){

    const A = state.A;

    const closed = A === 0;

    let html = "";

    html += wire(
        100,
        250,
        250,
        250,
        state.supply === 1
    );

    html += contact(
        300,
        250,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        340,
        250,
        650,
        250,
        state.supply === 1 && closed
    );

    html += lamp(
        700,
        250,
        state.Y === 1
    );

    html += wire(
        730,
        250,
        900,
        250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   RENDER AND / SERIES
========================================================= */

function renderAnd(){

    const A = state.A;
    const B = state.B;

    const liveA =
        state.supply === 1 &&
        A === 1;

    const liveB =
        liveA &&
        B === 1;

    let html = "";

    html += wire(
        100,250,
        210,250,
        state.supply === 1
    );

    html += contact(
        260,
        250,
        "A",
        A,
        false,
        "A"
    );

    html += wire(
        300,250,
        420,250,
        liveA
    );

    html += contact(
        470,
        250,
        "B",
        B,
        false,
        "B"
    );

    html += wire(
        510,250,
        650,250,
        liveB
    );

    html += lamp(
        700,
        250,
        state.Y === 1
    );

    html += wire(
        730,250,
        900,250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   RENDER NAND
========================================================= */

function renderNand(){

    const A = state.A;
    const B = state.B;

    const branchA =
        state.supply === 1 &&
        A === 0;

    const branchB =
        state.supply === 1 &&
        B === 0;

    let html = "";

    /* alimentação */

    html += wire(
        100,250,
        180,250,
        state.supply === 1
    );

    /* barramento esquerdo */

    html += wire(
        180,150,
        180,350,
        state.supply === 1
    );

    /* ramo A */

    html += wire(
        180,150,
        220,150,
        branchA
    );

    html += contact(
        270,
        150,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        310,150,
        650,150,
        branchA
    );

    /* ramo B */

    html += wire(
        180,350,
        220,350,
        branchB
    );

    html += contact(
        270,
        350,
        "B",
        B,
        true,
        "B"
    );

    html += wire(
        310,350,
        650,350,
        branchB
    );

    /* união */

    html += wire(
        650,150,
        650,250,
        state.Y === 1
    );

    html += wire(
        650,350,
        650,250,
        state.Y === 1
    );

    html += wire(
        650,250,
        670,250,
        state.Y === 1
    );

    html += lamp(
        710,
        250,
        state.Y === 1
    );

    html += wire(
        740,
        250,
        900,
        250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   RENDER OR / PARALLEL
========================================================= */

function renderOr(){

    const A = state.A;
    const B = state.B;

    const branchA =
        state.supply === 1 &&
        A === 1;

    const branchB =
        state.supply === 1 &&
        B === 1;

    let html = "";

    html += wire(
        100,250,
        180,250,
        state.supply === 1
    );

    html += wire(
        180,150,
        180,350,
        state.supply === 1
    );

    /* A */

    html += wire(
        180,150,
        220,150,
        branchA
    );

    html += contact(
        270,
        150,
        "A",
        A,
        false,
        "A"
    );

    html += wire(
        310,150,
        650,150,
        branchA
    );

    /* B */

    html += wire(
        180,350,
        220,350,
        branchB
    );

    html += contact(
        270,
        350,
        "B",
        B,
        false,
        "B"
    );

    html += wire(
        310,350,
        650,350,
        branchB
    );

    html += wire(
        650,150,
        650,250,
        state.Y === 1
    );

    html += wire(
        650,350,
        650,250,
        state.Y === 1
    );

    html += wire(
        650,250,
        670,250,
        state.Y === 1
    );

    html += lamp(
        710,
        250,
        state.Y === 1
    );

    html += wire(
        740,250,
        900,250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   RENDER NOR
========================================================= */

function renderNor(){

    const A = state.A;
    const B = state.B;

    const liveA =
        state.supply === 1 &&
        A === 0;

    const liveB =
        liveA &&
        B === 0;

    let html = "";

    html += wire(
        100,250,
        210,250,
        state.supply === 1
    );

    html += contact(
        260,
        250,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        300,250,
        420,250,
        liveA
    );

    html += contact(
        470,
        250,
        "B",
        B,
        true,
        "B"
    );

    html += wire(
        510,250,
        650,250,
        liveB
    );

    html += lamp(
        700,
        250,
        state.Y === 1
    );

    html += wire(
        730,250,
        900,250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   XOR
========================================================= */

function renderXor(){

    const A = state.A;
    const B = state.B;

    /*
       ramo 1:
       A NF + B NA
       ¬A · B

       ramo 2:
       A NA + B NF
       A · ¬B
    */

    const branch1 =
        state.supply === 1 &&
        A === 0 &&
        B === 1;

    const branch2 =
        state.supply === 1 &&
        A === 1 &&
        B === 0;

    let html = "";

    html += wire(
        100,250,
        170,250,
        state.supply === 1
    );

    html += wire(
        170,140,
        170,360,
        state.supply === 1
    );

    /* ramo 1 */

    html += wire(
        170,140,
        220,140,
        state.supply === 1
    );

    html += contact(
        270,
        140,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        310,140,
        390,140,
        A === 0
    );

    html += contact(
        440,
        140,
        "B",
        B,
        false,
        "B"
    );

    html += wire(
        480,140,
        650,140,
        branch1
    );

    /* ramo 2 */

    html += wire(
        170,360,
        220,360,
        state.supply === 1
    );

    html += contact(
        270,
        360,
        "A",
        A,
        false,
        "A"
    );

    html += wire(
        310,360,
        390,360,
        A === 1
    );

    html += contact(
        440,
        360,
        "B",
        B,
        true,
        "B"
    );

    html += wire(
        480,360,
        650,360,
        branch2
    );

    /* união */

    html += wire(
        650,140,
        650,250,
        branch1
    );

    html += wire(
        650,360,
        650,250,
        branch2
    );

    html += lamp(
        710,
        250,
        state.Y === 1
    );

    html += wire(
        740,250,
        900,250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   XNOR
========================================================= */

function renderXnor(){

    const A = state.A;
    const B = state.B;

    /*
       ramo 1:
       A NF + B NF
       ¬A · ¬B

       ramo 2:
       A NA + B NA
       A · B
    */

    const branch1 =
        state.supply === 1 &&
        A === 0 &&
        B === 0;

    const branch2 =
        state.supply === 1 &&
        A === 1 &&
        B === 1;

    let html = "";

    html += wire(
        100,250,
        170,250,
        state.supply === 1
    );

    html += wire(
        170,140,
        170,360,
        state.supply === 1
    );

    /* ramo 1 */

    html += wire(
        170,140,
        220,140,
        state.supply === 1
    );

    html += contact(
        270,
        140,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        310,140,
        390,140,
        A === 0
    );

    html += contact(
        440,
        140,
        "B",
        B,
        true,
        "B"
    );

    html += wire(
        480,140,
        650,140,
        branch1
    );

    /* ramo 2 */

    html += wire(
        170,360,
        220,360,
        state.supply === 1
    );

    html += contact(
        270,
        360,
        "A",
        A,
        false,
        "A"
    );

    html += wire(
        310,360,
        390,360,
        A === 1
    );

    html += contact(
        440,
        360,
        "B",
        B,
        false,
        "B"
    );

    html += wire(
        480,360,
        650,360,
        branch2
    );

    /* união */

    html += wire(
        650,140,
        650,250,
        branch1
    );

    html += wire(
        650,360,
        650,250,
        branch2
    );

    html += lamp(
        710,
        250,
        state.Y === 1
    );

    html += wire(
        740,250,
        900,250,
        state.Y === 1
    );

    return html;
}


/* =========================================================
   BYPASS
========================================================= */

function renderBypass(){

    const A = state.A;
    const B = state.B;

    const main =
        state.supply === 1 &&
        A === 0;

    const bypass =
        main &&
        B === 0;

    const lampOn =
        main &&
        B === 1;

    let html = "";

    html += wire(
        100,250,
        180,250,
        state.supply === 1
    );

    html += contact(
        230,
        250,
        "A",
        A,
        true,
        "A"
    );

    html += wire(
        270,250,
        400,250,
        main
    );

    /* derivação */

    html += wire(
        400,150,
        400,350,
        main
    );

    /* caminho da lâmpada */

    html += wire(
        400,150,
        500,150,
        lampOn
    );

    html += lamp(
        580,
        150,
        lampOn
    );

    html += wire(
        610,150,
        750,150,
        lampOn
    );

    html += wire(
        750,150,
        750,250,
        lampOn
    );

    /* caminho bypass */

    html += wire(
        400,350,
        500,350,
        bypass
    );

    html += contact(
        550,
        350,
        "B",
        B,
        true,
        "B"
    );

    html += wire(
        590,350,
        750,350,
        bypass
    );

    html += wire(
        750,350,
        750,250,
        bypass
    );

    /* retorno */

    html += wire(
        750,250,
        900,250,
        lampOn
    );

    return html;
}


/* =========================================================
   RENDER GERAL
========================================================= */

function render(){

    const circuit =
        document.getElementById("circuit");

    if(!circuit){
        throw new Error("Elemento SVG #circuit não encontrado.");
    }

    let html = "";

    switch(state.logic){

        case "BUFFER":
            html = renderBuffer();
            break;

        case "NOT":
            html = renderNot();
            break;

        case "AND":
        case "SERIES":
            html = renderAnd();
            break;

        case "NAND":
            html = renderNand();
            break;

        case "OR":
        case "PARALLEL":
            html = renderOr();
            break;

        case "NOR":
            html = renderNor();
            break;

        case "XOR":
            html = renderXor();
            break;

        case "XNOR":
            html = renderXnor();
            break;

        case "BYPASS":
            html = renderBypass();
            break;

        default:
            html = "";
    }

    circuit.innerHTML = html;
}


/* =========================================================
   INFORMAÇÕES DA FUNÇÃO
========================================================= */

function updateLogicInfo(){

    const info =
        document.getElementById("logicInfo");

    let title = "";
    let formula = "";
    let description = "";

    switch(state.logic){

        case "BUFFER":

            title = "BUFFER";
            formula = "Y = A";
            description =
                "Contato A normalmente aberto (NA) em série com a carga. Quando A=1, o contato fecha e a saída fica em 1.";

            break;

        case "NOT":

            title = "NOT";
            formula = "Y = ¬A";
            description =
                "Contato A normalmente fechado (NF) em série com a carga. Quando A=0, o contato conduz. Quando A=1, abre.";

            break;

        case "AND":

            title = "AND";
            formula = "Y = A · B";
            description =
                "Dois contatos NA em série. Os dois precisam estar em 1 para energizar a saída.";

            break;

        case "NAND":

            title = "NAND";
            formula = "Y = ¬(A · B)";
            description =
                "Dois contatos NF em paralelo. A saída fica em 1 para 00, 01 e 10, e fica em 0 somente para 11.";

            break;

        case "OR":

            title = "OR";
            formula = "Y = A + B";
            description =
                "Dois contatos NA em paralelo. Basta A ou B estar em 1 para energizar a saída.";

            break;

        case "NOR":

            title = "NOR";
            formula = "Y = ¬(A + B)";
            description =
                "Dois contatos NF em série. A saída somente fica em 1 quando A=0 e B=0.";

            break;

        case "XOR":

            title = "XOR";
            formula = "Y = (¬A · B) + (A · ¬B)";
            description =
                "Dois ramos paralelos: A NF + B NA e A NA + B NF. A saída fica em 1 quando as entradas são diferentes.";

            break;

        case "XNOR":

            title = "XNOR";
            formula = "Y = (¬A · ¬B) + (A · B)";
            description =
                "Dois ramos paralelos: A NF + B NF e A NA + B NA. A saída fica em 1 quando as entradas são iguais.";

            break;

        case "SERIES":

            title = "SERIES";
            formula = "Y = A · B";
            description =
                "Ligação em série equivalente à função AND.";

            break;

        case "PARALLEL":

            title = "PARALLEL";
            formula = "Y = A + B";
            description =
                "Ligação em paralelo equivalente à função OR.";

            break;

        case "BYPASS":

            title = "BYPASS";
            formula = "Y = ¬A · B";
            description =
                "Modelo Ladder de bypass: A é NF no caminho principal e B é NF no ramo de desvio. Quando o bypass está ativo, a carga é desviada.";

            break;
    }

    info.innerHTML =
        "<strong>" + title + "</strong><br>" +
        description +
        "<br><span class='formula'>" +
        formula +
        "</span>";
}


/* =========================================================
   TABELA-VERDADE
========================================================= */

function updateTruthTable(){

    const head =
        document.getElementById("truthHead");

    const body =
        document.getElementById("truthBody");

    head.innerHTML = "";
    body.innerHTML = "";

    if(state.logic === "NOT" ||
       state.logic === "BUFFER"){

        head.innerHTML = `
            <tr>
                <th>A</th>
                <th>Y</th>
            </tr>
        `;

        for(let a=0;a<=1;a++){

            const y =
                calculate(a,0,state.logic);

            const active =
                a === state.A;

            body.innerHTML += `
                <tr class="${active ? "active" : ""}">
                    <td>${a}</td>
                    <td>${y}</td>
                </tr>
            `;
        }

        return;
    }


    head.innerHTML = `
        <tr>
            <th>A</th>
            <th>B</th>
            <th>Y</th>
        </tr>
    `;


    if(state.logic === "BYPASS"){

        for(let a=0;a<=1;a++){

            for(let b=0;b<=1;b++){

                const result =
                    a === 0 && b === 1
                        ? 1
                        : 0;

                const active =
                    a === state.A &&
                    b === state.B;

                body.innerHTML += `
                    <tr class="${active ? "active" : ""}">
                        <td>${a}</td>
                        <td>${b}</td>
                        <td>${result}</td>
                    </tr>
                `;
            }
        }

        return;
    }


    for(let a=0;a<=1;a++){

        for(let b=0;b<=1;b++){

            const y =
                calculate(a,b,state.logic);

            const active =
                a === state.A &&
                b === state.B;

            body.innerHTML += `
                <tr class="${active ? "active" : ""}">
                    <td>${a}</td>
                    <td>${b}</td>
                    <td>${y}</td>
                </tr>
            `;
        }
    }
}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

    const a =
        document.getElementById("statusA");

    const b =
        document.getElementById("statusB");

    const supply =
        document.getElementById("statusSupply");

    const signal =
        document.getElementById("statusSignal");

    const y =
        document.getElementById("statusY");

    const bypass =
        document.getElementById("statusBypass");


    a.textContent = state.A;
    b.textContent = state.B;
    supply.textContent = state.supply;
    signal.textContent = state.signal;
    y.textContent = state.Y;
    bypass.textContent = state.bypass;


    [a,b,supply,signal,y,bypass].forEach(el => {

        el.classList.remove(
            "value-on",
            "value-off"
        );

        el.classList.add(
            el.textContent === "1"
                ? "value-on"
                : "value-off"
        );

    });
}


/* =========================================================
   ATUALIZAÇÃO PRINCIPAL
========================================================= */

function update(){

    state.supply =
        Number(
            document.getElementById("supply").value
        );


    state.logic =
        document.getElementById("logicType").value;


    if(state.logic === "BYPASS"){

        const result =
            calculateBypass();

        state.signal =
            result.signal;

        state.bypass =
            result.bypass;

        state.Y =
            result.Y;

    }else{

        state.signal =
            state.supply;

        state.bypass =
            0;

        const logicResult =
            calculate(
                state.A,
                state.B,
                state.logic
            );

        /*
           Se a alimentação estiver desligada,
           a saída física da Ladder fica desligada.
        */

        state.Y =
            state.supply === 1
                ? logicResult
                : 0;
    }


    updateStatus();
    updateLogicInfo();
    updateTruthTable();
    render();
}

    );

    );


/* =========================================================
   PROTEÇÃO CONTRA TELA BRANCA
========================================================= */

window.addEventListener(
    "error",
    function(event){

        const message =
            document.getElementById("message");

        if(message){

            message.className =
                "message error";

            message.innerHTML =
                "<strong>ERRO NO SIMULADOR:</strong><br>" +
                event.message;
        }

        console.error(event.error);
    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

try{

    update();

}catch(error){

    console.error(error);

    const message =
        document.getElementById("message");

    message.className =
        "message error";

    message.innerHTML =
        "<strong>Erro ao iniciar o simulador:</strong><br>" +
        error.message;
}
